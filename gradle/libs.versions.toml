[versions]
agp = "9.3.2"
kotlin = "2.2.10"
ksp = "2.3.11"
compose-bom = "2026.08.00"
hilt = "2.60.1"
androidx-hilt = "1.4.0"
room = "2.8.4"
core = "1.19.0"
activity = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.0"
work = "2.11.1"
datastore = "1.2.0"
coroutines = "1.10.2"
junit-jupiter = "6.0.0"
androidx-test-junit = "1.3.0"
espresso = "3.7.0"

[libraries]
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-compose-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
hilt-gradle-plugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }
room-gradle-plugin = { module = "androidx.room:room-gradle-plugin", version.ref = "room" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
